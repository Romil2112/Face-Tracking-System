# Scales on CPU (always available) and on face_detection_backend_per_second
# (requires prometheus-adapter configured to expose that custom metric via
# the custom.metrics.k8s.io API from face_detection_backend_total counters).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: face-tracking
  namespace: security-tools
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: face-tracking
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Pods
      pods:
        metric:
          name: face_detection_backend_per_second
        target:
          type: AverageValue
          averageValue: "50"
